<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" role="img" aria-label="日本語と英語の書類を行き来する、翻訳と英文書類の作成サポートを表す抽象ビジュアル">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/><stop offset=".52" stop-color="#eef3fa"/><stop offset="1" stop-color="#e2ebf6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#ffeec2" stop-opacity=".9"/><stop offset="1" stop-color="#fff3d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9853f" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#a9853f"/>
      <stop offset="1" stop-color="#a9853f" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fb"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3a6b"/><stop offset="1" stop-color="#274d8a"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="562"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="562" fill="url(#bg)"/>
    <rect width="900" height="562" fill="url(#glow)"/>

    <!-- 背景の経緯線（抽象的な地球） -->
    <g transform="translate(450 290)" fill="none" stroke="#6c85b4" stroke-opacity=".32" stroke-width="1.4">
      <circle r="250"/>
      <ellipse rx="250" ry="66"/><ellipse rx="250" ry="150"/>
      <ellipse rx="66" ry="250"/><ellipse rx="150" ry="250"/>
    </g>
    <circle cx="450" cy="290" r="250" fill="none" stroke="#a9853f" stroke-opacity=".45" stroke-width="2.2"/>

    <!-- 2つの書類を結ぶ金のアーク -->
    <g fill="none" stroke="url(#arc)" stroke-linecap="round">
      <path d="M318 226 C 390 150, 510 150, 582 226" stroke-width="3.2"/>
      <path d="M582 356 C 510 432, 390 432, 318 356" stroke-width="3.2"/>
    </g>
    <g fill="#a9853f">
      <path d="M582 226 l-16 -3 l7 14 z"/>
      <path d="M318 356 l16 3 l-7 -14 z"/>
    </g>

    <!-- 左の書類（日本語） -->
    <g transform="translate(96 132) rotate(-4 110 150)" filter="url(#shadow)">
      <rect width="220" height="300" rx="10" fill="url(#sheet)" stroke="#c9d5e8" stroke-width="1.4"/>
      <rect x="22" y="24" width="86" height="12" rx="6" fill="url(#navy)"/>
      <g fill="#c5d2e6">
        <rect x="22" y="62" width="176" height="8" rx="4"/>
        <rect x="22" y="84" width="150" height="8" rx="4"/>
        <rect x="22" y="106" width="176" height="8" rx="4"/>
        <rect x="22" y="128" width="128" height="8" rx="4"/>
        <rect x="22" y="160" width="176" height="8" rx="4"/>
        <rect x="22" y="182" width="158" height="8" rx="4"/>
        <rect x="22" y="204" width="176" height="8" rx="4"/>
        <rect x="22" y="226" width="112" height="8" rx="4"/>
      </g>
      <rect x="22" y="258" width="60" height="20" rx="10" fill="#f6ecd3" stroke="#c9a35f" stroke-width="1"/>
      <text x="52" y="272" text-anchor="middle" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="700" fill="#8a6a26">日本語</text>
    </g>

    <!-- 右の書類（英語） -->
    <g transform="translate(584 132) rotate(4 110 150)" filter="url(#shadow)">
      <rect width="220" height="300" rx="10" fill="url(#sheet)" stroke="#c9d5e8" stroke-width="1.4"/>
      <rect x="22" y="24" width="86" height="12" rx="6" fill="url(#navy)"/>
      <g fill="#c5d2e6">
        <rect x="22" y="62" width="176" height="8" rx="4"/>
        <rect x="22" y="84" width="164" height="8" rx="4"/>
        <rect x="22" y="106" width="176" height="8" rx="4"/>
        <rect x="22" y="128" width="140" height="8" rx="4"/>
        <rect x="22" y="160" width="176" height="8" rx="4"/>
        <rect x="22" y="182" width="170" height="8" rx="4"/>
        <rect x="22" y="204" width="176" height="8" rx="4"/>
        <rect x="22" y="226" width="96" height="8" rx="4"/>
      </g>
      <rect x="22" y="258" width="60" height="20" rx="10" fill="#f6ecd3" stroke="#c9a35f" stroke-width="1"/>
      <text x="52" y="272" text-anchor="middle" font-family="'Noto Sans JP','Yu Gothic',sans-serif" font-size="11" font-weight="700" fill="#8a6a26">English</text>
    </g>

    <!-- 中央のバッジ -->
    <g transform="translate(450 290)">
      <circle r="58" fill="#f6ecd3" opacity=".7" filter="url(#soft)"/>
      <circle r="42" fill="url(#navy)"/>
      <circle r="42" fill="none" stroke="#e7cf98" stroke-width="2"/>
      <g fill="none" stroke="#f3e2b6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-18 -8 H16 M8 -16 L16 -8 L8 0"/>
        <path d="M18 10 H-16 M-8 2 L-16 10 L-8 18"/>
      </g>
    </g>

    <rect width="900" height="562" fill="#000" filter="url(#grain)" opacity=".5"/>
  </g>
</svg>
