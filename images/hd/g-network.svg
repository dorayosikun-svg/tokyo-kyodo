<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" width="900" height="562" role="img" aria-label="東京・バンコク・シンガポール・ロンドン・ニューヨークを結ぶ国際ネットワーク">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/><stop offset=".52" stop-color="#eef3fa"/><stop offset="1" stop-color="#e2ebf6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".62" r=".55">
      <stop offset="0" stop-color="#ffeec2" stop-opacity=".95"/><stop offset="1" stop-color="#fff3d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9853f" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#a9853f"/>
      <stop offset="1" stop-color="#a9853f" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="node" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".40" stop-color="#f0d79f"/><stop offset="1" stop-color="#c9a35f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <clipPath id="frame"><rect width="900" height="562"/></clipPath>
  </defs>

  <g clip-path="url(#frame)"><g transform="translate(0 56)">
    <rect x="0" y="-70" width="900" height="700" fill="url(#bg)"/>
    <rect x="0" y="-70" width="900" height="700" fill="url(#glow)"/>

    <!-- 経緯線でできた抽象的な地球 -->
    <g transform="translate(640 250)" fill="none" stroke="#6c85b4" stroke-opacity=".58" stroke-width="1.6">
      <circle r="196" stroke-opacity=".26"/>
      <circle r="196" stroke="#a9853f" stroke-opacity=".52" stroke-width="2.4"/>
      <g>
        <ellipse rx="196" ry="52"/><ellipse rx="196" ry="118"/><ellipse rx="196" ry="170"/>
        <ellipse rx="52" ry="196"/><ellipse rx="118" ry="196"/><ellipse rx="170" ry="196"/>
      </g>
    </g>

    <!-- 拠点を結ぶ航路（金のアーク） -->
    <g fill="none" stroke="url(#arc)" stroke-linecap="round">
      <path d="M118 300 C 300 120, 520 128, 646 176" stroke-width="3" opacity="1"/>
      <path d="M118 300 C 260 250, 470 300, 700 320" stroke-width="2.4" opacity=".92"/>
      <path d="M646 176 C 720 96, 812 128, 836 210" stroke-width="2.4" opacity=".92"/>
      <path d="M700 320 C 760 360, 826 330, 836 210" stroke-width="2" opacity=".8"/>
      <path d="M118 300 C 340 400, 600 420, 836 210" stroke-width="1.8" opacity=".66"/>
    </g>
    <!-- 流れる光 -->
    <g fill="none" stroke="#fff2d6" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="3 210">
      <path d="M118 300 C 300 120, 520 128, 646 176">
        <animate attributeName="stroke-dashoffset" from="213" to="0" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <path d="M118 300 C 260 250, 470 300, 700 320" opacity=".8">
        <animate attributeName="stroke-dashoffset" from="213" to="0" dur="4.8s" begin="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M646 176 C 720 96, 812 128, 836 210" opacity=".75">
        <animate attributeName="stroke-dashoffset" from="213" to="0" dur="4.2s" begin="2.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- 拠点ノード -->
    <g>
      <g transform="translate(118 300)">
        <circle r="38" fill="url(#node)" opacity=".5"><animate attributeName="opacity" values=".25;.6;.25" dur="3s" repeatCount="indefinite"/></circle>
        <circle r="8" fill="#b8912f"/>
      </g>
      <g transform="translate(646 176)">
        <circle r="30" fill="url(#node)" opacity=".45"><animate attributeName="opacity" values=".2;.55;.2" dur="3.4s" begin=".6s" repeatCount="indefinite"/></circle>
        <circle r="6.4" fill="#b8912f"/>
      </g>
      <g transform="translate(700 320)">
        <circle r="30" fill="url(#node)" opacity=".45"><animate attributeName="opacity" values=".2;.55;.2" dur="3.8s" begin="1.3s" repeatCount="indefinite"/></circle>
        <circle r="6.4" fill="#b8912f"/>
      </g>
      <g transform="translate(836 210)">
        <circle r="27" fill="url(#node)" opacity=".4"><animate attributeName="opacity" values=".18;.5;.18" dur="4.2s" begin="2s" repeatCount="indefinite"/></circle>
        <circle r="5.6" fill="#b8912f"/>
      </g>
      <g transform="translate(470 96)">
        <circle r="14" fill="url(#node)" opacity=".3"/><circle r="2.8" fill="#c9a35f" opacity=".9"/>
      </g>
    </g>


    <!-- 微粒子（質感） -->
    </g>
    <rect width="900" height="562" filter="url(#grain)" fill="#6f7f9c" opacity=".34"/>
    <rect width="900" height="562" fill="none" stroke="#7d94b8" stroke-opacity=".15" stroke-width="26" filter="url(#soft)"/>
  </g>
</svg>
